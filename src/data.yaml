researchAreas:
  - id: 1
    title: Tactile Sensing
    description: Developing a broad range of tactile sensors (vision-based, force/pressure, multimodal, and more) to give robots rich touch perception for dexterous manipulation and physical interaction.
    image: /images/research-tactile-sensing.jpg
  - id: 2
    title: Dexterous Manipulation
    description: Creating algorithms and control strategies for multi-fingered robotic hands to perform intricate tasks such as in-hand manipulation and tool use.
    image: /images/research-dexterous-manipulation.jpg
  - id: 3
    title: Embodied AI & Teleoperation
    description: Building systems for intuitive human-robot teleoperation and collecting high-quality embodied data to train robust robotic policies.
    image: /images/research-embodied-ai-teleoperation.jpg
openings:
  - id: 1
    title: Master / PhD Students (Fall 2026 or Fall 2027)
    type: Master / PhD Program
    description: |-
      实验室每年约招收2-3名硕士/博士生，且有和北京通用人工智能研究院联培机会。我们欢迎对机器人与人工智能方向的最前沿、最有挑战性的研究课题感兴趣的同学加入。请发邮件详询。
      The lab recruits about 2–3 master's/PhD students each year, with a joint-training opportunity through the Beijing Institute for General Artificial Intelligence (BIGAI). We welcome students interested in the most cutting-edge and challenging research in robotics and AI. Please email for details.
    requirements:
      - Bachelor's or Master's degree in CS, EE, ME, or related fields.
      - Willing to conduct challenging top-tier research in robotics and AI.
      - Experience with tactile sensors, manipulation, or computer vision is a plus.
  - id: 2
    title: Research Assistants / Interns
    type: Internship
    description: |-
      我们接收每年2-3名有志于从事机器人研究的本校实习生，以及希望在本实验室开展科研并在未来攻读博士学位的外访学生。你将与实验室成员紧密合作，参与前沿机器人课题研究。请发邮件详询。
      Each year we accept 2–3 on-campus interns committed to robotics research, as well as visiting students who wish to conduct research in our lab and pursue a PhD in the future. You will work closely with lab members on cutting-edge robotics projects. Please email for details.
    requirements:
      - Self-motivated and passionate about robotics.
      - Experience in relevant competitions or prerequisite coursework in robotics, AI, electronics, mechanical engineering, or related fields.
      - Commitment of at least 15 hours per week.
patents:
  - id: 1
    title: XXX
    inventors: 肖晨曦 (Chenxi Xiao), XXX
    status: 已授权 (Granted)
    number: CN123456789B
    date: "2025.10"
    description: |-
      本发明公开了一种基于视触觉融合的灵巧手抓取控制方法及系统，通过多模态传感器获取目标物体的物理属性，实现自适应稳定抓取。
      This invention discloses a visuo-tactile-fusion-based grasp control method and system for dexterous hands. It acquires the physical properties of target objects through multimodal sensors to achieve adaptive stable grasping.
  - id: 2
    title: A High-Resolution Multimodal Tactile Sensor for Robotic Manipulation
    inventors: Chenxi Xiao, XXX
    status: 申请中 (Pending)
    number: XXX
    date: "2025.05"
    description: A novel tactile sensor design capable of simultaneously measuring normal force, shear force, and temperature distribution for embodied AI applications.
